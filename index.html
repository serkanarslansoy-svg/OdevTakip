<style type="text/tailwindcss">
@layer base{
  html,body{width:100%;margin:0;padding:0;background-color:#0f131d;}
  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:'Plus Jakarta Sans',sans-serif;}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}
  .pt-safe{padding-top:env(safe-area-inset-top,0px);}
  ::-webkit-scrollbar{display:none;}
  .no-scrollbar{scrollbar-width:none;}
}
.inp{@apply w-full px-3 py-2.5 rounded-lg bg-surface-container-lowest text-on-surface text-[14px] font-semibold placeholder:text-outline placeholder:font-medium focus:outline-none focus:ring-2 focus:ring-primary-container/60 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] transition-all;}
.lbl{@apply text-[12px] font-extrabold uppercase tracking-wider text-on-surface-variant mb-1 flex items-center gap-1;}
.btn-green{@apply w-full flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-primary-container text-on-primary-container font-extrabold text-[15px] shadow-[0_4px_0_#007139] active:translate-y-1 active:shadow-[0_1px_0_#007139] transition-all;}
.btn-orange{@apply w-full flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-secondary-container text-on-secondary font-extrabold text-[15px] shadow-[0_4px_0_#572000] active:translate-y-1 active:shadow-[0_1px_0_#572000] transition-all;}
.btn-ghost{@apply w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-full bg-surface-container-high text-on-surface font-extrabold text-[14px] shadow-[0_3px_0_#0a0e18] active:translate-y-0.5 transition-all;}
.card{@apply relative overflow-hidden rounded-lg bg-surface-container p-space-md shadow-[0_4px_0_#070a11];}
</style>
<style>
@keyframes pulseGlow { 0%,100% { box-shadow:0 0 14px rgba(255,107,0,.35);} 50% { box-shadow:0 0 28px rgba(255,107,0,.75);} }
@keyframes fireGlow { 0%,100% { transform:scale(1);} 50% { transform:scale(1.08);} }
@keyframes bossPulse { 0%,100% { box-shadow:0 0 15px rgba(255,107,0,.3),0 0 30px rgba(255,68,0,.2);} 50% { box-shadow:0 0 30px rgba(255,107,0,.7),0 0 50px rgba(255,68,0,.4);} }
@keyframes digitGlow { 0%,100% { text-shadow:0 0 8px rgba(0,255,136,.5);} 50% { text-shadow:0 0 16px rgba(0,255,136,.9);} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
@keyframes toastIn { from { transform:translate(-50%,20px); opacity:0;} to { transform:translate(-50%,0); opacity:1;} }
.shake{animation:shake .4s ease-in-out;}
.digit-glow{animation:digitGlow 2s infinite ease-in-out;}
#toast{animation:toastIn .25s ease-out;}
</style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">

<div class="mx-auto w-full max-w-[480px] min-h-screen flex flex-col relative bg-surface shadow-[0_0_60px_rgba(0,0,0,0.6)]">
  <!-- HEADER -->
  <header class="fixed top-0 z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.35)] w-full max-w-[480px] left-1/2 -translate-x-1/2">
    <div class="h-16 px-gutter flex items-center justify-between gap-space-xs">
      <div class="flex items-center gap-space-xs min-w-0">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary-container to-tertiary-fixed-dim flex items-center justify-center shadow-[0_0_12px_rgba(0,255,136,0.4)] shrink-0">
          <span class="text-xl leading-none">🏹</span>
        </div>
        <div class="flex flex-col min-w-0 max-w-[130px]">
          <span class="font-extrabold text-[18px] leading-[24px] tracking-tight text-primary leading-none whitespace-nowrap truncate">Ödev Avcısı</span>
          <span id="header-sub" class="text-[12px] font-extrabold uppercase tracking-wider text-on-surface-variant leading-none mt-0.5 whitespace-nowrap truncate">Görevler</span>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <div id="lvl-chip" class="items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high shadow-[0_0_12px_rgba(0,255,136,0.2)] shrink-0" title="Toplam XP">
          <span class="material-symbols-outlined text-primary-container text-base leading-none">bolt</span>
          <span id="lvl-chip-text" class="text-[15px] font-extrabold leading-[18px] text-primary-container leading-none">LVL 1</span>
        </div>
        <div id="sync-dot" class="flex items-center gap-1 px-2 py-1 rounded-full bg-surface-container-high shrink-0" title="Senkron durumu">
          <span class="w-2 h-2 rounded-full bg-outline"></span>
          <span id="sync-dot-text" class="text-[10px] font-extrabold text-on-surface-variant max-sm:hidden">LOKAL</span>
        </div>
        <div class="inline-flex items-center p-0.5 rounded-full bg-surface-container-low shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]">
          <button id="role-student" onclick="switchRole('student')" class="px-2.5 py-1.5 rounded-full text-[12px] font-extrabold transition-all flex items-center gap-1"><img src="" class="w-5 h-5 rounded-full object-cover" alt="Rüzgar">Ruz</button>
          <button id="role-parent" onclick="switchRole('parent')" class="px-2.5 py-1.5 rounded-full text-[12px] font-extrabold transition-all flex items-center gap-1"><img src="" class="w-5 h-5 rounded-full object-cover" alt="Serkan">Veli</button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main id="main" class="flex-1 flex flex-col w-full pt-16 pb-28"></main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl border-t border-surface-container-high w-full max-w-[480px] left-1/2 -translate-x-1/2">
    <div id="bottom-nav" class="grid grid-cols-5 px-2 py-1.5"></div>
  </nav>
</div>

<!-- TOAST -->
<div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[90] max-w-[440px] w-[92%] rounded-xl bg-surface-container-high text-on-surface text-[14px] font-bold px-4 py-3 shadow-[0_8px_30px_rgba(0,0,0,0.6)] border border-outline-variant text-center"></div>

<!-- PIN MODAL -->
<div id="pin-modal" class="hidden fixed inset-0 z-[80] bg-black/70 backdrop-blur-sm flex items-center justify-center px-6">
  <div id="pin-box" class="w-full max-w-[340px] rounded-xl bg-surface-container p-6 shadow-[0_10px_40px_rgba(0,0,0,0.7)] flex flex-col items-center gap-4">
    <div class="w-14 h-14 rounded-full bg-secondary-container/20 flex items-center justify-center shadow-[0_0_16px_rgba(254,107,0,0.4)]">
      <span class="material-symbols-outlined text-secondary-container text-3xl" style="font-variation-settings:'FILL' 1;">shield_lock</span>
    </div>
    <div class="text-center">
      <h3 class="text-[18px] font-extrabold text-primary">Komutan Doğrulaması</h3>
      <p class="text-[12px] font-semibold text-on-surface-variant mt-1">Veli moduna girmek için PIN gir</p>
    </div>
    <div id="pin-dots" class="flex gap-3"></div>
    <div class="grid grid-cols-3 gap-2 w-full mt-1" id="pin-keys"></div>
    <button onclick="closePin()" class="text-[12px] font-extrabold text-on-surface-variant mt-1">VAZGEÇ</button>
    <p class="text-[10px] font-semibold text-outline">İlk kullanım PIN'i: 1234 (Ayarlar'dan değiştir)</p>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div id="confirm-modal" class="hidden fixed inset-0 z-[80] bg-black/70 backdrop-blur-sm flex items-center justify-center px-6">
  <div class="w-full max-w-[340px] rounded-xl bg-surface-container p-6 shadow-[0_10px_40px_rgba(0,0,0,0.7)] flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-secondary-container text-2xl">help</span>
      <h3 id="confirm-title" class="text-[16px] font-extrabold text-primary">Emin misin?</h3>
    </div>
    <p id="confirm-msg" class="text-[13px] font-semibold text-on-surface-variant"></p>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="closeConfirm()" class="btn-ghost">İptal</button>
      <button id="confirm-yes" class="btn-orange">Onayla</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detail-modal" class="hidden fixed inset-0 z-[80] bg-black/70 backdrop-blur-sm flex items-center justify-center px-6">
  <div id="detail-box" class="w-full max-w-[380px] rounded-xl bg-surface-container p-6 shadow-[0_10px_40px_rgba(0,0,0,0.7)]"></div>
</div>

const avatarFor = role => role === 'parent' ? AVATAR_SERKAN : AVATAR_RUZ;
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const todayStr = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const WEEK_TR = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const WEEK_ABBR = ['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'];
const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MONTHS_ABBR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const wIdx = d => (new Date(d).getDay() + 6) % 7; // 0=Pzt
function fmtDateTR(ds){ const d = new Date(ds + 'T00:00:00'); return d.getDate() + ' ' + MONTHS_ABBR[d.getMonth()] + ' ' + WEEK_TR[d.getDay()]; }
function fmtExamDT(e){ return fmtDateTR(e.date) + ' • ' + (e.time || '09:30'); }
function taskDue(t){ const time = t.dueTime || '23:59'; return new Date(t.dueDate + 'T' + time); }
function fmtDue(t){
  const due = taskDue(t), now = new Date();
  const d0 = ymd(now), d1 = ymd(addDays(1));
  const tm = (t.dueTime || '23:59');
  if (t.dueDate === d0) return 'Bugün ' + tm;
  if (t.dueDate === d1) return 'Yarın ' + tm;
  return fmtDateTR(t.dueDate) + ' ' + tm;
}
function isOverdue(t){ return (t.status === 'active') && taskDue(t) < new Date(); }
function leftLabel(dt){
  const ms = dt - Date.now(); if (ms <= 0) return 'SÜRE DOLDU';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  return (d > 0 ? d + ' GÜN ' : '') + h + ' SAAT ' + m + ' DK';
}
function cdText(ms){
  if (ms <= 0) return 'SÜRE DOLDU';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);
  return (d ? d+'g ' : '') + h + 's ' + m + 'dk ' + s + 'sn';
}
/* Ödev ödülü: XP ve altın birbirinden bağımsızdır. */
function taskGold(t){
  if (t && typeof t.gold === 'number') return Math.max(0, t.gold);
  const xp = Math.max(0, Number(t && t.xp) || 0);
  if (xp <= 50) return 0;                 // mini görev
  if ((t && t.difficulty === 'boss') || xp >= 200) return 20; // zor/boss görev
  if (xp >= 150) return 10;               // orta görev
  return 5;                               // standart görev
}

function migrate(s){
  if ((s.version || 1) < 2) {
    s.tasks = realTasks();
    s.version = 2;
  }
  if (s.version < 3) {
    s.rewards = s.rewards || [];
    const oldFriend = s.rewards.find(r => r.title === 'Arkadaşıyla Buluşma');
    if (oldFriend) Object.assign(oldFriend, { title:'Gece Kuşu: Hafta sonu 1 saat geç yatma', cost:500, icon:'🌙' });
    const oldGame = s.rewards.find(r => r.title === 'Yeni Oyun Alımı');
    if (oldGame) Object.assign(oldGame, { title:'Büyük Ödül', cost:2000, icon:'🎁' });
    [['Sevdiği Atıştırmalığı Seç',150,'🍫'],['30 Dakika Ek Oyun',200,'🎮'],['Akşam Yemeğini Seç',400,'🍔'],['Hype Günü',600,'🤸'],['Sushi Günü',1000,'🍣'],['Sürpriz Aktivite',1500,'🎯']].forEach(([title,cost,icon]) => {
      if (!s.rewards.some(r => r.title === title)) s.rewards.push({ id:uid(), title, cost, icon, active:true });
    });
    /* Önceden kazanılmış, artık kullanılmayan rozetleri temizle. */
    ['boss','streak3','streak7','exam'].forEach(id => { if (s.badges) delete s.badges[id]; });
    s.version = 3;
  }
  if ((s.version || 1) < 4) {
    /* XP artık seviye ilerlemesi; harcanan para ayrı olarak altın. */
    const oldXp = Math.max(0, Number(s.xp) || 0);
    if (typeof s.totalXp !== 'number') s.totalXp = oldXp;
    if (typeof s.gold !== 'number') s.gold = Math.floor(oldXp / 10);
    s.rewards = (s.rewards || []).map(r => Object.assign(r, { cost: Math.max(1, Math.round((Number(r.cost) || 0) / 10)) }));
    s.redemptions = (s.redemptions || []).map(r => Object.assign(r, { cost: Math.max(0, Math.round((Number(r.cost) || 0) / 10)) }));
    s.level10RewardClaimed = !!s.level10RewardClaimed;
    s.version = 4;
  }
  if ((s.version || 1) < 5) {
    /* Yeni paylaşılan ödev listesini mevcut veriyi bozmadan ekle/güncelle. */
    const latest = realTasks();
    s.tasks = s.tasks || [];
    latest.forEach(nt => {
      const old = s.tasks.find(t => t.title === nt.title || (nt.subject === 'art' && t.dueDate === nt.dueDate && t.subject === 'art'));
      if (old) { old.desc = nt.desc; old.dueDate = nt.dueDate; old.subject = nt.subject; }
      else s.tasks.push(nt);
    });
    s.version = 5;
  }
  if ((s.version || 1) < 6) {
    /* Önceden girilmiş sınav notlarını yeni ödül tablosuna uyarla. */
    let xpDelta = 0, goldDelta = 0;
    (s.exams || []).forEach(e => {
      if (e.score == null) return;
      const oldXp = Number(e.awardedXp) || 0;
      const newXp = examBonus(e, Number(e.score));
      const delta = newXp - oldXp;
      e.awardedXp = newXp;
      xpDelta += delta;
      goldDelta += Math.max(1, Math.round(newXp / 10)) - Math.max(1, Math.round(oldXp / 10));
      const d = e.awardedAt || e.date;
      if (d && delta !== 0) {
        const h = (s.history || []).find(x => x.d === d);
        if (h) h.xp += delta;
      }
    });
    s.xp = Math.max(0, (Number(s.xp) || 0) + xpDelta);
    s.totalXp = Math.max(0, (Number(s.totalXp) || 0) + xpDelta);
    s.gold = Math.max(0, (Number(s.gold) || 0) + goldDelta);
    s.version = 6;
  }
  if ((s.version || 1) < 7) {
    /* Eski görevlerde altın XP'den bağımsız standarda taşınır. */
    (s.tasks || []).forEach(t => {
      if (typeof t.gold === 'number') return;
      /* Tamamlanan eski görevlerin geçmiş bakiyesi bozulmasın; yeni standardı yalnızca aktif/bekleyenlere uygula. */
      t.gold = t.status === 'completed' ? Math.max(1, Math.round((Number(t.xp) || 0) / 10)) : taskGold(t);
    });
    s.version = 7;
  }
  s.tasks = s.tasks || []; s.exams = s.exams || []; s.schedule = s.schedule || [];
  s.rewards = s.rewards || []; s.redemptions = s.redemptions || []; s.history = s.history || [];
  s.badges = s.badges || {}; s.alarmsLast = s.alarmsLast || {};
  s.totalXp = Math.max(0, Number(s.totalXp) || Number(s.xp) || 0);
  s.gold = Math.max(0, Number(s.gold) || 0);
  s.level10RewardClaimed = !!s.level10RewardClaimed;
  s.settings = Object.assign({ pin:'1234', notify:false, firebase:null }, s.settings || {});
  s.student = s.student || { name:'Rüzgar', nickname:'Ruz', grade:'Terza Media' };
  /* Eski ders anahtarlarını yeni sisteme taşı */
  s.tasks.forEach(t => { t.subject = SUBJECT_MAP[t.subject] || t.subject; });
  s.exams.forEach(e => { e.subject = SUBJECT_MAP[e.subject] || e.subject; });
  return s;
}

const LEVEL_THRESHOLDS = [0, 500, 1200, 2200, 3500, 5200, 7500, 10500, 14500, 20000];
function goldForXp(xp){ return Math.max(1, Math.round((Number(xp) || 0) / 10)); }
function levelOf(xp){
  const value = Math.max(0, Number(xp) || 0);
  let level = 1;
  for (let i = LEVEL_THRESHOLDS.length - 1; i >= 0; i--) {
    if (value >= LEVEL_THRESHOLDS[i]) { level = i + 1; break; }
  }
  const floor = LEVEL_THRESHOLDS[level - 1];
  const max = level >= LEVEL_THRESHOLDS.length;
  const next = max ? floor : LEVEL_THRESHOLDS[level];
  const need = Math.max(1, next - floor);
  const into = max ? need : Math.max(0, value - floor);
  return { level, title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)], into, need, pct: max ? 100 : Math.min(100, Math.round(into / need * 100)), max, total: value };
}

function removeHistory(xp, date){
  const d = String(date || todayStr()).slice(0, 10);
  const h = state.history.find(x => x.d === d);
  if (!h) return;
  h.xp = Math.max(0, h.xp - xp);
  h.n = Math.max(0, h.n - 1);
  if (h.n === 0) state.history = state.history.filter(x => x !== h);
}
function recalcStreak(){
  const days = [...new Set(state.history.filter(h => h.n > 0).map(h => h.d))].sort();
  if (!days.length) { state.streak = 0; state.lastCompletionDate = null; return; }
  let streak = 1;
  for (let i = days.length - 1; i > 0; i--) {
    const cur = new Date(days[i] + 'T00:00:00');
    const prev = new Date(days[i - 1] + 'T00:00:00');
    if ((cur - prev) / 864e5 !== 1) break;
    streak++;
  }
  state.streak = streak;
  state.lastCompletionDate = days[days.length - 1];
}
function bumpStreak(){
  const t = todayStr(), y = ymd(addDays(-1));
  if (state.lastCompletionDate === t) return;
  state.streak = (state.lastCompletionDate === y) ? (state.streak + 1) : 1;
  state.lastCompletionDate = t;
}

  state.history.forEach(h => { if (h.d >= from) { xp += h.xp; n += h.n; } });
  return { xp, n };
}

function beep(short){
  try {
    beep.ctx = beep.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = beep.ctx, t0 = ctx.currentTime;
    const seq = short ? [1175] : [880, 1175, 1568];
    seq.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.18, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.14);
      o.connect(g).connect(ctx.destination);
      o.start(s); o.stop(s + 0.18);
    });
  } catch(e) {}
}

    new Notification('⏰ BOSS ALARMI: ' + exam.title, { body: fmtExamDT(exam) + ' • ' + leftLabel(new Date(exam.date + 'T' + (exam.time||'09:30'))), icon: ICON_URI });
  } catch(e) {}
}
function checkAlarms(){
  const t = todayStr();
  state.exams.forEach(e => {
    const left = Math.ceil((new Date(e.date + 'T' + (e.time||'09:30')) - new Date()) / 864e5);
    if (left >= 0 && left <= (e.alarmDays || 2) && state.alarmsLast[e.id] !== t) {
      state.alarmsLast[e.id] = t;
      beep(false);
      notifyExam(e);
      toast('🚨 BOSS ALARMI: ' + e.title + ' — ' + leftLabel(new Date(e.date + 'T' + (e.time||'09:30'))));

  });

function askPin(cb){ pinCb = cb; pinVal = ''; drawPinDots(); $('#pin-modal').classList.remove('hidden'); }

/* ---- Program ---- */
let progDay = wIdx(new Date()), progFilter = 'all';
function renderProgram(){
  const monday = addDays(-wIdx(new Date()));
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
  const todayIdx = wIdx(new Date());
  const chips = days.map((d, i) => {
    const on = progDay === i;
    const isToday = i === todayIdx;
    return '<button onclick="progDay=' + i + ';renderProgram()" class="flex flex-col items-center justify-center min-w-[54px] py-2 px-1.5 rounded-2xl transition-all ' +
      (on ? 'bg-primary-container text-on-primary-container shadow-[0_4px_0_#007139,0_0_16px_rgba(0,255,136,0.4)] -translate-y-0.5' : 'bg-surface-container-high text-on-surface-variant shadow-[0_4px_0_#0a0e18]') + '">' +
      '<span class="text-[11px] font-extrabold">' + (isToday ? 'BUGÜN' : WEEK_ABBR[i]) + '</span>' +
      '<span class="text-[15px] font-extrabold mt-0.5">' + d.getDate() + '</span></button>';
  }).join('');
  let items = state.schedule.filter(s => s.day === progDay && (progFilter === 'all' || s.type === progFilter)).sort((a,b) => a.start.localeCompare(b.start));
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const toMin = hhmm => (+hhmm.split(':')[0]) * 60 + (+hhmm.split(':')[1]);
  let nowItem = null, nextItem = null;
  items.forEach(it => { const s = toMin(it.start), e = toMin(it.end); if (nowMin >= s && nowMin < e) nowItem = it; else if (s > nowMin && !nextItem) nextItem = it; });
  const fullDay = state.schedule.filter(s => s.day === progDay).sort((a,b) => a.start.localeCompare(b.start));
  const nowFull = fullDay.find(it => nowMin >= toMin(it.start) && nowMin < toMin(it.end));
  const nextFull = fullDay.find(it => toMin(it.start) > nowMin);
  const radar = '' +
    '<div class="flex items-center gap-2.5 bg-surface-container-lowest/80 p-2.5 rounded-xl shadow-inner">' +
      '<div class="relative flex items-center justify-center w-3.5 h-3.5 shrink-0">' +
        '<span class="absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75 animate-ping"></span>' +
        '<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary-container shadow-[0_0_8px_#00ff88]"></span>' +
      '</div>' +
      '<div class="flex-1 min-w-0">' +
        '<p class="text-[12px] font-extrabold text-primary-fixed truncate">ŞU AN: <span class="text-primary">' + (nowFull ? esc(nowFull.title) + ' (' + esc(nowFull.place || '') + ')' : (progDay === 5 || progDay === 6 ? 'Hafta Sonu — Serbest Zaman' : 'Serbest Zaman / Ders Çalışma')) + '</span></p>' +
        '<p class="text-[12px] font-semibold text-on-surface-variant truncate">Sonraki: ' + (nextFull ? esc(nextFull.start + ' ' + nextFull.title + ' (' + (nextFull.place || '') + ')') : 'Bugün planlanmış etkinlik yok') + '</p>' +
      '</div>' +
      '<div class="flex items-center gap-1 px-2 py-1 rounded-lg bg-surface-container-high text-tertiary-fixed text-[15px] font-extrabold" id="clock-now">' +
        '<span class="material-symbols-outlined text-sm">schedule</span><span>' + new Date().toTimeString().slice(0,5) + '</span>' +
      '</div>' +
    '</div>';
  const rows = items.length ? items.map(it => {
    const isNow = nowItem && nowItem.id === it.id;
    const school = it.type === 'school';
    return '<div class="relative flex gap-3">' +
      '<div class="flex flex-col items-center pt-4"><span class="text-[15px] font-extrabold ' + (isNow ? 'text-primary-container' : 'text-on-surface') + '">' + it.start + '</span><div class="w-0.5 flex-1 my-1 rounded ' + (isNow ? 'bg-primary-container shadow-[0_0_8px_#00ff88]' : 'bg-surface-container-highest') + '"></div><span class="text-[12px] font-semibold text-on-surface-variant pb-4">' + it.end + '</span></div>' +
      '<div class="flex-1 card mb-1 ' + (isNow ? 'ring-1 ring-primary-container/60 shadow-[0_0_18px_rgba(0,255,136,0.15)]' : '') + '">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<div class="flex items-center gap-2 min-w-0">' +
            '<div class="w-9 h-9 rounded-lg ' + (school ? 'bg-tertiary-container/20 text-tertiary-fixed-dim' : 'bg-secondary-container/20 text-secondary-container') + ' flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-xl">' + (school ? 'school' : 'sports_kabaddi') + '</span></div>' +
            '<div class="min-w-0"><p class="text-[15px] font-extrabold text-on-surface truncate">' + esc(it.title) + '</p><p class="text-[12px] font-semibold text-on-surface-variant truncate">' + esc(it.place || '') + '</p></div>' +
          '</div>' +
          (isNow ? '<span class="px-2 py-0.5 rounded-full bg-primary-container text-on-primary-container text-[10px] font-extrabold shrink-0">ŞİMDİ</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="card py-8 flex flex-col items-center gap-2 text-center"><span class="material-symbols-outlined text-4xl text-outline-variant">event_busy</span><p class="text-[14px] font-bold text-on-surface">' + (progDay === 5 || progDay === 6 ? 'Hafta sonu — planlanmış ders yok 🎮' : 'Bu gün için program yok') + '</p></div>';

  $('#main').innerHTML = '<div class="flex flex-col w-full px-gutter gap-space-md pb-6">' +
    '<div class="card">' +
      '<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary-container via-tertiary-fixed-dim to-secondary-container"></div>' +
      '<div class="flex items-start justify-between gap-2 mb-3 pt-1">' +
        '<div><p class="text-[18px] font-extrabold text-primary">Orario Settimanale — Haftalık Program</p><p class="text-[12px] font-semibold text-on-surface-variant">' + esc(state.student.name) + ' • ' + esc(state.student.grade) + ' • Okul: 08:00-13:50</p></div>' +
      '</div>' + radar +
    '</div>' +
    '<div class="grid grid-cols-3 gap-1.5 p-1 bg-surface-container-lowest rounded-full shadow-[0_4px_0_#070a11]">' +
      [['all','TÜMÜ'],['school','OKUL DERSLERİ'],['course','KURS & ETÜT']].map(f =>
        '<button onclick="progFilter=\'' + f[0] + '\';renderProgram()" class="py-2 rounded-full text-[12px] font-extrabold transition-all ' + (progFilter === f[0] ? 'bg-primary-container text-on-primary-container' : 'text-on-surface-variant') + '">' + f[1] + '</button>'
      ).join('') +
    '</div>' +
    '<div class="flex items-center gap-2 overflow-x-auto no-scrollbar -mx-gutter px-gutter py-1">' + chips + '</div>' +
    '<div class="flex flex-col">' + rows + '</div>' +
  '</div>';
}

/* ---- Sınavlar ---- */
function renderSinavlar(){
  const now = new Date();
  const exams = state.exams.map(e => ({ ...e, dt: new Date(e.date + 'T' + (e.time || '09:30')) })).sort((a,b) => a.dt - b.dt);
  const up = exams.filter(e => e.dt >= now);
  const past = exams.filter(e => e.dt < now).reverse();

    hero = '<div class="relative rounded-lg bg-surface-container p-space-md flex flex-col gap-2 ' + (days <= (next.alarmDays || 2) ? 'animate-boss-pulse' : 'shadow-[0_4px_0_#070a11]') + '">' +

          const v = { d, h, m, s }[u[1]];

        }).join('') +
      '</div>' +
      (days <= (next.alarmDays || 2) ? '<div class="flex items-center gap-1.5 text-[12px] font-extrabold text-secondary mt-1"><span class="material-symbols-outlined text-base animate-alert-beacon">notifications_active</span>' + days + ' gün kaldı — Boss Alarmı aktif!</div>' : '') +
    '</div>';

      '<p class="text-[12px] font-semibold text-on-surface-variant truncate">' + sub.name + ' • ' + esc(e.time || '09:30') + (e.note ? ' • ' + esc(e.note) : '') + '</p></div>' +
      '<div class="text-right shrink-0">' +
        (e.dt >= now
          ? '<span class="text-[12px] font-extrabold ' + (days <= 2 ? 'text-secondary' : 'text-tertiary-fixed-dim') + '">' + (days === 0 ? 'BUGÜN!' : days + ' gün') + '</span>' +
            '<p class="text-[11px] font-semibold text-on-surface-variant" data-cd="' + e.id + '">' + cdText(e.dt - Date.now()) + '</p>'
          : e.score != null ? '<span class="px-2 py-0.5 rounded-full ' + (e.score >= 8 ? 'bg-primary-container/15 text-primary-container' : 'bg-surface-container-highest text-on-surface-variant') + ' text-[11px] font-extrabold">' + nf(e.score) + '/10' + (e.boss !== false && e.score >= 8 ? ' • BOSS YENİLDİ' : '') + '</span>' : '<span class="px-2 py-0.5 rounded-full bg-surface-container-highest text-on-surface-variant text-[10px] font-extrabold">NOT BEKLENİYOR</span>') +
      '</div>' +
    '</div>';
  };
  $('#main').innerHTML = '<div class="flex flex-col w-full px-gutter gap-space-md pb-6">' +
    '<div class="relative overflow-hidden rounded-lg bg-surface-container-high p-space-md shadow-[0_4px_20px_rgba(0,255,136,0.12)]">' +

          '<p class="text-[12px] font-semibold text-on-surface mt-0.5">Sınavlardan <span class="text-primary-container font-extrabold">2 gün önceden</span> sesli & görsel Boss Alarmı kurulur.</p>' +
        '</div>' +
      '</div>' +
      (state.settings.notify && ('Notification' in window) && Notification.permission === 'granted'
        ? ''
        : '<button onclick="askNotify()" class="btn-ghost mt-3"><span class="material-symbols-outlined text-base">notifications</span>Bildirim İzinini Aç</button>') +
    '</div>' +
    hero +
    (up.length ? '<h3 class="text-[16px] font-bold text-on-surface pt-1">Yaklaşan Sınavlar (' + up.length + ')</h3><div class="flex flex-col gap-2.5">' + up.map(examRow).join('') + '</div>' : '<div class="card py-8 text-center"><span class="text-4xl">🗓️</span><p class="text-[14px] font-bold text-on-surface mt-2">Planlanmış sınav yok</p><p class="text-[12px] font-semibold text-on-surface-variant">Sınavlar veli panelinden planlanır</p></div>') +
    (past.length ? '<h3 class="text-[16px] font-bold text-on-surface-variant pt-2">Geçmiş Sınavlar</h3><div class="flex flex-col gap-2.5">' + past.map(examRow).join('') + '</div>' : '') +
  '</div>';
}

function weekBars(){
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(-i);
    const h = state.history.find(x => x.d === ymd(d));
    days.push({ lbl: WEEK_ABBR[wIdx(d)], xp: h ? h.xp : 0, n: h ? h.n : 0 });
  }
  const max = Math.max(50, ...days.map(d => d.xp));
  return days.map(d =>
    '<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">' +
      '<span class="text-[9px] font-extrabold text-tertiary-fixed-dim">' + (d.xp || '') + '</span>' +
      '<div class="w-full rounded-t-md ' + (d.xp ? 'bg-gradient-to-t from-primary-fixed-dim to-primary-container shadow-[0_0_8px_rgba(0,255,136,0.5)]' : 'bg-surface-container-highest') + '" style="height:' + Math.max(4, Math.round(d.xp / max * 100)) + '%;"></div>' +
      '<span class="text-[9px] font-extrabold text-on-surface-variant">' + d.lbl + '</span>' +
    '</div>'
  ).join('');
}

function submitTask(){

  const desc = $('#tf-desc').value.trim();
  const xp = Math.max(10, Math.min(5000, parseInt($('#tf-xp').value) || 100));
  const gold = Math.max(0, Math.min(500, parseInt($('#tf-gold').value) || 0));

  state.tasks.push({ id: uid(), title, desc, subject: tfSub, difficulty: tfDiff, xp, gold, createdAt: todayStr(), dueDate: date, dueTime: time, status: 'active' });
  save(); renderGorev();
  toast('⚔️ Görev yayınlandı! ' + (state.student.nickname || '') + ' ekranında görünecek.');
  beep(true);
}
function editTaskReward(id){
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  const wasCompleted = t.status === 'completed';
  const oldXp = Number(t.xp) || 0;
  const oldGold = taskGold(t);
  const xpRaw = prompt('Bu görev kaç XP versin?', String(t.xp));
  if (xpRaw === null) return;
  const goldRaw = prompt('Bu görev kaç altın versin?', String(oldGold));
  if (goldRaw === null) return;
  const xp = Math.max(10, Math.min(5000, Number(xpRaw) || 0));
  const gold = Math.max(0, Math.min(500, Number(goldRaw) || 0));
  if (!xp) { toast('XP 0 olamaz.'); return; }
  t.xp = Math.round(xp); t.gold = Math.round(gold);
  if (wasCompleted) {
    const xpDelta = t.xp - oldXp;
    const goldDelta = t.gold - oldGold;
    state.xp = Math.max(0, state.xp + xpDelta);
    state.totalXp = Math.max(0, state.totalXp + xpDelta);
    state.gold = Math.max(0, state.gold + goldDelta);
    if (t.completedAt && xpDelta) {
      const h = state.history.find(x => x.d === t.completedAt);
      if (h) h.xp = Math.max(0, h.xp + xpDelta);
    }
    pruneBadges(); checkBadges();
  }
  save(); renderGorev(); toast('✅ Görev ödülü güncellendi: +' + t.xp + ' XP / +' + t.gold + ' 🪙');
}

function deleteExam(id){
  askConfirm('Sınavı sil', 'Bu sınav ' + state.student.nickname + '"nin ekranından da kalkacak.', () => {
    const exam = state.exams.find(e => e.id === id);
    if (exam && exam.awardedXp) {
      state.xp = Math.max(0, state.xp - exam.awardedXp);
      state.totalXp = Math.max(0, state.totalXp - exam.awardedXp);
      state.gold = Math.max(0, state.gold - goldForXp(exam.awardedXp));
      removeHistory(exam.awardedXp, exam.awardedAt);
    }
    state.exams = state.exams.filter(e => e.id !== id);
    pruneBadges();
    save(); renderPlanla(); toast('Sınav silindi');
  }, 'Sil');
}
function examBonus(e, score){
  if (score == null || score < 7) return 0;
  /* Sınava girmek tek başına ödül vermez; puan başarıya göre kazanılır. */
  if (e.boss === false) return score >= 10 ? 250 : score >= 9 ? 150 : score >= 8 ? 100 : 50;
  return score >= 10 ? 500 : score >= 9 ? 300 : score >= 8 ? 200 : 100;
}
function recordExamScore(id){
  const e = state.exams.find(x => x.id === id); if (!e) return;
  const raw = prompt('"' + e.title + '" notu (0–10, örn. 8,5):', e.score == null ? '' : String(e.score).replace('.', ','));
  if (raw === null) return;
  const normalized = raw.trim().replace(',', '.');
  const score = Number(normalized);
  if (!normalized || !Number.isFinite(score) || score < 0 || score > 10 || !/^\d+(?:\.\d{1,2})?$/.test(normalized)) { toast('0 ile 10 arasında geçerli bir not gir.'); return; }
  const previous = e.awardedXp || 0;
  const bonus = examBonus(e, score);
  const earnedAt = e.awardedAt || todayStr();
  if (previous) removeHistory(previous, earnedAt);
  if (bonus) {
    const h = state.history.find(x => x.d === earnedAt);
    if (h) { h.xp += bonus; h.n += 1; }
    else state.history.push({ d: earnedAt, xp: bonus, n:1 });
  }
  state.xp = Math.max(0, state.xp + bonus - previous);
  state.totalXp = Math.max(0, state.totalXp + bonus - previous);
  state.gold = Math.max(0, state.gold + goldForXp(bonus) - goldForXp(previous));
  e.score = score; e.awardedXp = bonus; e.awardedAt = bonus ? earnedAt : null;
  pruneBadges(); checkBadges(); save(); renderAll();
  toast('📋 Not kaydedildi: ' + nf(score) + '/10 • ' + (bonus >= previous ? '+' : '') + (bonus - previous) + ' XP / ' + (goldForXp(bonus) - goldForXp(previous) >= 0 ? '+' : '') + (goldForXp(bonus) - goldForXp(previous)) + ' 🪙');
}

        '<p class="text-[11px] font-semibold text-secondary mt-2">⚠️ Test modu kuralları herkese açık verir; verilerde yalnızca görev/ödül bilgisi tutulur, yine de Firebase projesini kimseyle paylaşma.</p>' +
      '</details>' +
      '<textarea id="st-fb" class="inp font-mono !text-[11px] min-h-[110px]" placeholder=\'{\n  "apiKey": "AIza...",\n  "authDomain": "proje.firebaseapp.com",\n  "databaseURL": "https://proje-default-rtdb.firebaseio.com",\n  "projectId": "proje",\n  "storageBucket": "proje.appspot.com",\n  "messagingSenderId": "123",\n  "appId": "1:123:web:abc"\n}\'>' + (fb ? esc(JSON.stringify(fb, null, 2)) : '') + '</textarea>' +
      '<button onclick="fbConnectForm()" class="btn-green"><span class="material-symbols-outlined">cloud_upload</span>Bağlan & Senkronize Et</button>' +
    '</section>' +
    /* Yedek */
    '<section class="card flex flex-col gap-3">' +
      '<h3 class="text-[16px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-tertiary-fixed-dim">save</span>Yedek & Sıfırlama</h3>' +
      '<div class="grid grid-cols-2 gap-2">' +
        '<button onclick="exportData()" class="btn-ghost"><span class="material-symbols-outlined">download</span>Dışa Aktar</button>' +
        '<label class="btn-ghost cursor-pointer"><span class="material-symbols-outlined">upload</span>İçe Aktar<input type="file" id="st-import" accept=".json" class="hidden" onchange="importData(this)"></label>' +
      '</div>' +
      '<button onclick="resetProgress()" class="w-full py-2.5 rounded-full bg-secondary-container/15 text-secondary text-[13px] font-extrabold flex items-center justify-center gap-2"><span class="material-symbols-outlined text-base">restart_alt</span>Ruz İlerlemesini Sıfırla</button>' +
      '<button onclick="resetData()" class="w-full py-2.5 rounded-full bg-error-container/15 text-error text-[13px] font-extrabold flex items-center justify-center gap-2"><span class="material-symbols-outlined text-base">dangerous</span>Tüm Verileri Sıfırla</button>' +
    '</section>' +
    '<p class="text-center text-[11px] font-semibold text-outline-variant">Ödev Avcısı v1.0 • ' + esc(state.student.name) + ' için 💚</p>' +
  '</div>';
}
function savePin(){
  const a = $('#st-pin1').value, b = $('#st-pin2').value;
  if (!/^\d{4}$/.test(a)) { toast('PIN 4 haneli olmalı!'); return; }
  if (a !== b) { toast('PIN\'ler eşleşmiyor!'); return; }
  state.settings.pin = a; save(); toast('🔐 PIN güncellendi');
}
function fbConnectForm(){
  let cfg;
  try { cfg = JSON.parse($('#st-fb').value); } catch(e) { toast('⚠️ JSON formatı hatalı!'); return; }
  if (!cfg.databaseURL || !cfg.projectId) { toast('⚠️ "databaseURL" ve "projectId" zorunlu!'); return; }
  if (fbConnect(cfg)) {
    state.settings.firebase = cfg; save();
    try {
      FB.ref.once('value').then(snap => {
        const remote = snap.val();
        if (remote) {
          toast('☁️ Buluttaki veriler yüklendi (senkron aktif)');
        } else {
          FB.ref.set(state);
          toast('☁️ Bağlandı! Yerel veriler buluta yüklendi.');
        }
        renderAll();
      });
    } catch(e) {}
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'odev-avcisi-yedek-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('💾 Yedek indirildi');
}
function importData(input){
  const f = input.files && input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s.version) throw new Error('Geçersiz dosya');
      askConfirm('Yedeği yükle', 'Mevcut veriler yedekteki verilerle değiştirilecek. Devam?', () => {
        state = migrate(s); save(); renderAll(); toast('✅ Yedek yüklendi');
      }, 'Yükle');
    } catch(e) { toast('⚠️ Dosya okunamadı!'); }
  };
  reader.readAsText(f);
}
function resetData(){
  askConfirm('TÜM VERİLERİ SİL', 'Görevler, XP, sınavlar, ödüller — her şey sıfırlanır ve örnek verilere döner. Bu işlem geri alınamaz!', () => {
    state = seedState(); save(); renderAll(); toast('Uygulama sıfırlandı');
  }, 'Sıfırla');
}
function resetProgress(){
  askConfirm('RUZ İLERLEMESİNİ SIFIRLA', 'XP, seviye, seri, rozetler, tamamlanma durumları ve takas geçmişi sıfırlanacak. Görev listesi, sınavlar, program ve ödüller korunacak. Devam edilsin mi?', () => {
    state.xp = 0;
    state.totalXp = 0;
    state.gold = 0;
    state.level10RewardClaimed = false;
    state.streak = 0;
    state.lastCompletionDate = null;
    state.history = [];
    state.badges = {};
    state.redemptions = [];
    state.tasks.forEach(t => { t.status = 'active'; t.completedAt = null; });
    state.exams.forEach(e => { delete e.score; delete e.awardedXp; delete e.awardedAt; });
    save(); renderAll(); toast('Ruz ilerlemesi sıfırlandı: LVL 1 • 0 XP');
  }, 'Sıfırla');
}

/* ---------- Onay / Red ---------- */
function approveTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'pending') return;
  t.status = 'completed'; t.completedAt = todayStr();
  state.xp += t.xp;
  state.totalXp += t.xp;
  state.gold += taskGold(t);
  addHistory(t.xp); bumpStreak(); checkBadges(); save();
  renderAll();
  toast('✅ Onaylandı! +' + t.xp + ' XP • +' + taskGold(t) + ' 🪙 altın');
  beep(false);
}
function rejectTask(id){
  askConfirm('Görevi reddet', 'Görev tekrar "aktif" duruma döner, XP verilmez.', () => {
    const t = state.tasks.find(x => x.id === id); if (t) t.status = 'active';
    save(); renderAll(); toast('Görev reddedildi — tekrar tamamlanabilir');
  }, 'Reddet');
}
function undoCompletedTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'completed') return;
  askConfirm('Tamamlamayı geri al', '"' + t.title + '" yeniden aktif olacak. Verilen ' + nf(t.xp) + ' XP geri alınacak; seri ve rozetler yeniden hesaplanacak.', () => {
    const oldBadgeCount = Object.keys(state.badges).length;
    state.xp = Math.max(0, state.xp - t.xp);
    state.totalXp = Math.max(0, state.totalXp - t.xp);
    state.gold = Math.max(0, state.gold - taskGold(t));
    removeHistory(t.xp, t.completedAt);
    t.status = 'active';
    t.completedAt = null;
    recalcStreak();
    pruneBadges();
    const removedBadges = oldBadgeCount - Object.keys(state.badges).length;
    save(); renderAll();
    toast('↩️ Görev geri alındı • -' + nf(t.xp) + ' XP / -' + taskGold(t) + ' 🪙' + (removedBadges > 0 ? ' • ' + removedBadges + ' rozet kilitlendi' : ''));
  }, 'Geri Al');
}
function approveRedeem(id){
  const r = state.redemptions.find(x => x.id === id); if (!r) return;
  r.status = 'approved'; checkBadges(); save(); renderAll();
  toast('🎁 Ödül onaylandı! İyi eğlenceler!');
  beep(false);
}
function rejectRedeem(id){
  askConfirm('Takası reddet', 'Harcanan ' + nf(state.redemptions.find(x => x.id === id).cost) + ' altın geri iade edilecek.', () => {
    const r = state.redemptions.find(x => x.id === id); if (!r) return;
    r.status = 'rejected'; state.gold += r.cost;
    save(); renderAll(); toast('Takas reddedildi, altın iade edildi');
  }, 'Reddet');
}

/* ---------- Öğrenci görev tamamlama ---------- */
function completeTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'active') return;
  askConfirm('Görev bitti mi?', '"' + t.title + '" onaya gönderilecek. Komutanın onaylamasıyla +' + t.xp + ' XP ve +' + taskGold(t) + ' 🪙 hesabına geçecek!', () => {
    t.status = 'pending'; t.completedAt = null;
    save(); renderAll();
    toast('📨 Görev onaya gönderildi! Onay gelince XP ve altın hesabına geçecek ⚡');
    beep(true);
  }, 'Gönder');
}

/* ---------- Görselleştirme ---------- */
/* CSS text-transform Türkçe 'i'yi 'I' yapıyor; yaprak metinleri JS ile TR büyük harfe çevir */
function trUpper(root){
  if (!root) return;
  root.querySelectorAll('*').forEach(el => {
    if (el.children.length === 0 && el.textContent.trim() && getComputedStyle(el).textTransform === 'uppercase') {
      el.textContent = el.textContent.toLocaleUpperCase('tr-TR');
      el.style.textTransform = 'none';
    }
  });
}
function renderAll(){
  renderHeader(); renderNav();
  const v = ui.view;
  if (ui.role === 'parent') {
    if (v === 'panel') renderPanel();
    else if (v === 'gorev') renderGorev();
    else if (v === 'planla') renderPlanla();
    else if (v === 'odulmgr') renderOdulmgr();
    else if (v === 'ayarlar') renderAyarlar();
    else { ui.view = 'panel'; renderPanel(); }
  } else {
    if (v === 'home') renderHome();
    else if (v === 'dersler') renderDersler();
    else if (v === 'program') renderProgram();
    else if (v === 'sinavlar') renderSinavlar();
    else if (v === 'oduller') renderOduller();
    else { ui.view = 'home'; renderHome(); }
  }
  trUpper($('#main'));
  trUpper(document.querySelector('header'));
  trUpper(document.getElementById('bottom-nav'));
}

/* ---------- Timer'lar ---------- */
setInterval(() => {
  const now = new Date();
  // Geri sayımlar
  state.exams.forEach(e => {
    const dt = new Date(e.date + 'T' + (e.time || '09:30'));
    $$('[data-cd="' + e.id + '"]').forEach(el => { el.textContent = cdText(dt - now); });
    const box = $('[data-cd-box="' + e.id + '"]');
    if (box) {
      const ms = Math.max(0, dt - now);
      const set = (u, val) => { const q = box.querySelector('[data-cd-u="' + u + '"]'); if (q) q.textContent = String(val).padStart(2, '0'); };
      set('d', Math.floor(ms/864e5)); set('h', Math.floor(ms%864e5/36e5)); set('m', Math.floor(ms%36e5/6e4)); set('s', Math.floor(ms%6e4/1e3));
    }
  });
  const clock = $('#clock-now'); if (clock) clock.lastElementChild.textContent = now.toTimeString().slice(0, 5);
}, 1000);
setInterval(checkAlarms, 60000);

/* ---------- PWA Manifest ---------- */
try {
  const mf = { name: 'Ödev Avcısı', short_name: 'Ödev Avcısı', display: 'standalone', background_color: '#0f131d', theme_color: '#0f131d', start_url: '.', icons: [{ src: ICON_URI, sizes: '48x48', type: 'image/svg+xml' }] };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
  document.head.appendChild(link);
} catch(e) {}

/* ---------- Başlat ---------- */
checkBadges();
checkAlarms();
renderAll();
/* Yeni kurulumlarda ortak bulut senkronunu otomatik başlat. */
setTimeout(() => {
  if (!state.settings.firebase) {
    state.settings.firebase = DEFAULT_FIREBASE_CONFIG;
    save();
  }
  if (state.settings.firebase && !FB.connected) fbConnect(state.settings.firebase);
}, 250);
</script>
