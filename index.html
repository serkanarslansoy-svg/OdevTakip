<script>
/* ============================================================
   ÖDEV AVCISI — tek dosya uygulama
   Öğrenci (Ruz) + Veli (Komutan) modu, XP/Seri/Rozet,
   Sınav Boss Alarmları, localStorage + Firebase Realtime Sync
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf  = n => Number(n || 0).toLocaleString('tr-TR');
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const todayStr = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const WEEK_TR = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const WEEK_ABBR = ['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'];
const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MONTHS_ABBR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const wIdx = d => (new Date(d).getDay() + 6) % 7; // 0=Pzt
function fmtDateTR(ds){ const d = new Date(ds + 'T00:00:00'); return d.getDate() + ' ' + MONTHS_ABBR[d.getMonth()] + ' ' + WEEK_TR[d.getDay()]; }
function fmtExamDT(e){ return fmtDateTR(e.date) + ' • ' + (e.time || '09:30'); }
function taskDue(t){ const time = t.dueTime || '23:59'; return new Date(t.dueDate + 'T' + time); }
function fmtDue(t){
  const due = taskDue(t), now = new Date();
  const d0 = ymd(now), d1 = ymd(addDays(1));
  const tm = (t.dueTime || '23:59');
  if (t.dueDate === d0) return 'Bugün ' + tm;
  if (t.dueDate === d1) return 'Yarın ' + tm;
  return fmtDateTR(t.dueDate) + ' ' + tm;
}
function isOverdue(t){ return (t.status === 'active') && taskDue(t) < new Date(); }
function leftLabel(dt){
  const ms = dt - Date.now(); if (ms <= 0) return 'SÜRE DOLDU';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  return (d > 0 ? d + ' GÜN ' : '') + h + ' SAAT ' + m + ' DK';
}
function cdText(ms){
  if (ms <= 0) return 'SÜRE DOLDU';
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);
  return (d ? d+'g ' : '') + h + 's ' + m + 'dk ' + s + 'sn';
}

const SUBJECTS = {
  mat:{ name:'Matematik',       it:'Matematica',          icon:'calculate' },
  ita:{ name:'İtalyanca',       it:'Italiano',            icon:'menu_book' },
  sci:{ name:'Fen Bilimleri',   it:'Scienze',             icon:'science'   },
  sto:{ name:'Tarih',           it:'Storia',              icon:'history_edu' },
  geo:{ name:'Coğrafya',         it:'Geografia',           icon:'public'    },
  ing:{ name:'İngilizce',       it:'Inglese',             icon:'language'  },
  fra:{ name:'Fransızca',       it:'Francese',            icon:'translate' },
  art:{ name:'Görsel Sanatlar', it:'Arte e Immagine',     icon:'palette'   },
  mus:{ name:'Müzik',           it:'Musica',              icon:'music_note' },
  tec:{ name:'Teknoloji',       it:'Tecnologia',          icon:'precision_manufacturing' },
  rel:{ name:'Din Kültürü',     it:'Religione',           icon:'auto_stories' },
  gym:{ name:'Beden Eğitimi',   it:'Ed. Fisica',          icon:'sports_soccer' }

/* Eski anahtar -> yeni ders anahtarı eşlemesi (veri taşima) */
const SUBJECT_MAP = { mat:'mat', fen:'sci', tur:'ita', ing:'ing', sos:'sto', din:'rel' };

/* Gerçek okul programı: 6 ders/gün, Pzt-Cum (Terza Media)
   Ders saatleri varsayılan 08:00-13:50; Veli > Planla'dan düzenlenebilir. */
function realSchedule(){
  const hours = [
    ['08:00','08:55'], ['08:55','09:50'], ['10:00','10:55'],
    ['10:55','11:50'], ['12:00','12:55'], ['12:55','13:50']
  ];
  const week = [ // [Pzt, Sal, Çar, Per, Cum] -> [subjectKey, ekstra etiket]
    ['mat','mat','ita','geo','mus','ing'],
    ['mus','sci','fra','fra','ita','sto'],
    ['art','art','ita','ita','ita','rel'],
    ['gym','gym','ing','ing','mat','mat'],
    ['sci','ita','tec','tec','geo','sto']
  ];
  const items = [];
  week.forEach((day, d) => day.forEach((s, h) => {
    items.push({ id: uid(), day: d, type:'school',
      start: hours[h][0], end: hours[h][1],
      title: (SUBJECTS[s].name + ' (' + SUBJECTS[s].it + ')'),
      place: 'Okul' });
  }));
  return items;
}
const LEVEL_TITLES = ['Çırak Avcı','Genç Avcı','Keskin Pençe','Gölgeler Avcısı','Siber Avcı','Veri Ustası','Kod Şövalyesi','Bilgi Savaşçısı','Efsane Muhafız','Boss Termonatör'];

  { t:'Yeni Nesil Test Çözümü', d:'20 Yeni Nesil Matematik sorusu çözülecek, boş sorular video çözümden taranacak.', s:'mat', diff:'boss',   xp:350 },

  { t:'Fen Konu Özeti',        d:'Konu farkları renkli şema ile deftere çizilecek.',                                  s:'sci', diff:'normal', xp:250 }

function addHistory(xp){
  const t = todayStr();
  let h = state.history.find(x => x.d === t);
  if (h) { h.xp += xp; h.n += 1; } else { state.history.push({ d: t, xp, n: 1 }); }
}
function removeHistory(xp, date){
  const d = String(date || todayStr()).slice(0, 10);
  const h = state.history.find(x => x.d === d);
  if (!h) return;
  h.xp = Math.max(0, h.xp - xp);
  h.n = Math.max(0, h.n - 1);
  if (h.n === 0) state.history = state.history.filter(x => x !== h);
}
function recalcStreak(){
  const days = [...new Set(state.history.filter(h => h.n > 0).map(h => h.d))].sort();
  if (!days.length) { state.streak = 0; state.lastCompletionDate = null; return; }
  let streak = 1;
  for (let i = days.length - 1; i > 0; i--) {
    const cur = new Date(days[i] + 'T00:00:00');
    const prev = new Date(days[i - 1] + 'T00:00:00');
    if ((cur - prev) / 864e5 !== 1) break;
    streak++;
  }
  state.streak = streak;
  state.lastCompletionDate = days[days.length - 1];
}
function bumpStreak(){
  const t = todayStr(), y = ymd(addDays(-1));
  if (state.lastCompletionDate === t) return;
  state.streak = (state.lastCompletionDate === y) ? (state.streak + 1) : 1;
  state.lastCompletionDate = t;
}
function weekStats(){
  let xp = 0, n = 0;
  const from = ymd(addDays(-6));
  state.history.forEach(h => { if (h.d >= from) { xp += h.xp; n += h.n; } });
  return { xp, n };
}

/* ---------- Ses & Bildirim ---------- */
function beep(short){
  try {
    beep.ctx = beep.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = beep.ctx, t0 = ctx.currentTime;
    const seq = short ? [1175] : [880, 1175, 1568];
    seq.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.18, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.14);
      o.connect(g).connect(ctx.destination);
      o.start(s); o.stop(s + 0.18);
    });
  } catch(e) {}
}

    return '<button onclick="progDay=' + i + ';renderProgram()" class="flex flex-col items-center justify-center min-w-[54px] py-2 px-1.5 rounded-2xl transition-all ' +

  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();

  items.forEach(it => { const s = toMin(it.start), e = toMin(it.end); if (nowMin >= s && nowMin < e) nowItem = it; else if (s > nowMin && !nextItem) nextItem = it; });
  const fullDay = state.schedule.filter(s => s.day === progDay).sort((a,b) => a.start.localeCompare(b.start));

    return '<div class="relative flex gap-3">' +

          '<div class="flex items-center gap-2 min-w-0">' +
            '<div class="w-9 h-9 rounded-lg ' + (school ? 'bg-tertiary-container/20 text-tertiary-fixed-dim' : 'bg-secondary-container/20 text-secondary-container') + ' flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-xl">' + (school ? 'school' : 'sports_kabaddi') + '</span></div>' +

  $('#main').innerHTML = '<div class="flex flex-col w-full px-gutter gap-space-md pb-6">' +

  const exams = state.exams.map(e => ({ ...e, dt: new Date(e.date + 'T' + (e.time || '09:30')) })).sort((a,b) => a.dt - b.dt);
  const up = exams.filter(e => e.dt >= now);
  const past = exams.filter(e => e.dt < now).reverse();
  const next = up[0];
  let hero = '';
  if (next) {
    const days = Math.ceil((next.dt - now) / 864e5);
    const sub = SUBJECTS[next.subject] || { name:'Sınav' };
    hero = '<div class="relative rounded-lg bg-surface-container p-space-md flex flex-col gap-2 ' + (days <= (next.alarmDays || 2) ? 'animate-boss-pulse' : 'shadow-[0_4px_0_#070a11]') + '">' +
      '<div class="flex items-center justify-between gap-2">' +
        '<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container text-white shadow-[0_0_12px_rgba(254,107,0,0.6)]">' +
          '<span class="material-symbols-outlined text-base animate-bounce" style="font-variation-settings:\'FILL\' 1;">warning</span>' +
          '<span class="text-[12px] font-extrabold uppercase">En Yakın Boss Savaşı</span></div>' +
        '<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-highest text-secondary-fixed text-[15px] font-extrabold"><span class="material-symbols-outlined text-sm">schedule</span>' + esc(fmtExamDT(next)) + '</div>' +
      '</div>' +
      '<h2 class="text-[22px] font-extrabold text-primary leading-tight">' + esc(next.title) + '</h2>' +
      '<p class="text-[12px] font-semibold text-on-surface-variant">' + sub.name + (next.note ? ' • ' + esc(next.note) : '') + '</p>' +
      '<div class="grid grid-cols-4 gap-1.5 mt-1" data-cd-box="' + next.id + '">' +
        [['GÜN','d'],['SAAT','h'],['DAKİKA','m'],['SANİYE','s']].map(u => {
          const ms = next.dt - Date.now();
          const d = Math.max(0, Math.floor(ms/864e5)), h = Math.max(0, Math.floor(ms%864e5/36e5)), m = Math.max(0, Math.floor(ms%36e5/6e4)), s = Math.max(0, Math.floor(ms%6e4/1e3));

function redeemReward(id){
  const r = state.rewards.find(x => x.id === id); if (!r) return;
  if (state.xp < r.cost) { toast('Yetersiz XP!'); return; }
  askConfirm('Ödülü takas et', '"' + r.title + '" için ' + nf(r.cost) + ' XP harcanacak ve Komutanın onayına gönderilecek. Onaylanmazsa XP iade edilir.', () => {
    state.xp -= r.cost;
    state.redemptions.push({ id: uid(), rewardId: r.id, title: r.title, icon: r.icon, cost: r.cost, status: 'pending', date: todayStr() });
    checkBadges(); save(); renderAll();
    toast('🎁 Takas talebi gönderildi! Komutan onayı bekleniyor.');
    beep(true);
  }, 'Takas Et');
}

function weekBars(){
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(-i);
    const h = state.history.find(x => x.d === ymd(d));
    days.push({ lbl: WEEK_ABBR[wIdx(d)], xp: h ? h.xp : 0, n: h ? h.n : 0 });
  }
  const max = Math.max(50, ...days.map(d => d.xp));
  return days.map(d =>
    '<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">' +
      '<span class="text-[9px] font-extrabold text-tertiary-fixed-dim">' + (d.xp || '') + '</span>' +

      '<span class="text-[9px] font-extrabold text-on-surface-variant">' + d.lbl + '</span>' +
    '</div>'
  ).join('');
}

function deleteExam(id){
  askConfirm('Sınavı sil', 'Bu sınav ' + state.student.nickname + '"nin ekranından da kalkacak.', () => {
    const exam = state.exams.find(e => e.id === id);
    if (exam && exam.awardedXp) {
      state.xp = Math.max(0, state.xp - exam.awardedXp);
      removeHistory(exam.awardedXp, exam.awardedAt);
    }
    state.exams = state.exams.filter(e => e.id !== id);
    pruneBadges();
    save(); renderPlanla(); toast('Sınav silindi');
  }, 'Sil');
}
function examBonus(e, score){
  if (score == null || score < 7) return 0;
  if (e.boss === false) return score >= 10 ? 300 : score >= 9 ? 225 : score >= 8 ? 150 : 0;
  return score >= 10 ? 600 : score >= 9 ? 450 : score >= 8 ? 300 : 100;
}
function recordExamScore(id){
  const e = state.exams.find(x => x.id === id); if (!e) return;
  const raw = prompt('"' + e.title + '" notu (0–10, örn. 8,5):', e.score == null ? '' : String(e.score).replace('.', ','));
  if (raw === null) return;
  const normalized = raw.trim().replace(',', '.');
  const score = Number(normalized);
  if (!normalized || !Number.isFinite(score) || score < 0 || score > 10 || !/^\d+(?:\.\d{1,2})?$/.test(normalized)) { toast('0 ile 10 arasında geçerli bir not gir.'); return; }
  const previous = e.awardedXp || 0;
  const bonus = examBonus(e, score);
  const earnedAt = e.awardedAt || todayStr();
  if (previous) removeHistory(previous, earnedAt);
  if (bonus) {
    const h = state.history.find(x => x.d === earnedAt);
    if (h) { h.xp += bonus; h.n += 1; }
    else state.history.push({ d: earnedAt, xp: bonus, n:1 });
  }
  state.xp = Math.max(0, state.xp + bonus - previous);
  e.score = score; e.awardedXp = bonus; e.awardedAt = bonus ? earnedAt : null;
  pruneBadges(); checkBadges(); save(); renderAll();
  toast('📋 Not kaydedildi: ' + nf(score) + '/10 • ' + (bonus >= previous ? '+' : '') + (bonus - previous) + ' XP');
}

          '<button onclick="rejectRedeem(\'' + r.id + '\')" class="px-2.5 py-1.5 rounded-full bg-error-container text-on-error-container text-[10px] font-extrabold">RED</button></div>'
        : '<span class="text-[10px] font-extrabold ' + cls + ' shrink-0">' + st + '</span>') +
    '</div>';
  }).join('') : '<p class="text-[13px] font-semibold text-on-surface-variant py-1">Henüz takas talebi yok.</p>';

  $('#main').innerHTML = '<div class="flex flex-col w-full px-gutter gap-space-lg pb-6">' +
    '<div class="card flex flex-col gap-3">' +
      '<h2 class="text-[18px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-primary-container">redeem</span>Yeni Ödül Ekle</h2>' +
      '<div class="grid grid-cols-[70px_1fr] gap-2">' +
        '<div><label class="lbl">Simge</label><input id="rf-icon" class="inp !px-2 text-center text-xl" value="🎁" maxlength="4"></div>' +
        '<div><label class="lbl">Ödül Adı *</label><input id="rf-title" class="inp" placeholder="Örn: 1 Saat Oyun Konsolu"></div>' +
      '</div>' +
      '<div><label class="lbl">XP Fiyatı *</label><input id="rf-cost" type="number" min="10" max="100000" step="50" value="500" class="inp !w-32"></div>' +
      '<button onclick="submitReward()" class="btn-green"><span class="material-symbols-outlined">add_shopping_cart</span>Mağazaya Ekle</button>' +
    '</div>' +
    '<section class="card"><h3 class="text-[15px] font-extrabold text-primary mb-1">Ödül Mağazası</h3>' + (rows || '<p class="text-[13px] font-semibold text-on-surface-variant py-2">Mağaza boş.</p>') + '</section>' +
    '<section class="card"><h3 class="text-[15px] font-extrabold text-primary mb-1">Takas Talepleri & Geçmiş</h3>' + histHtml + '</section>' +
  '</div>';
}
function submitReward(){
  const title = $('#rf-title').value.trim();
  if (!title) { toast('⚠️ Ödül adı gerekli!'); return; }
  const cost = Math.max(10, parseInt($('#rf-cost').value) || 100);
  state.rewards.push({ id: uid(), title, cost, icon: $('#rf-icon').value.trim() || '🎁', active: true });
  save(); renderOdulmgr(); toast('🛍️ Ödül mağazaya eklendi');
}
function toggleReward(id){
  const r = state.rewards.find(x => x.id === id); if (!r) return;
  r.active = r.active === false; save(); renderOdulmgr();
}
function deleteReward(id){
  askConfirm('Ödülü sil', 'Bu ödül mağazadan kaldırılacak.', () => {
    state.rewards = state.rewards.filter(r => r.id !== id);
    save(); renderOdulmgr(); toast('Ödül silindi');
  }, 'Sil');
}

/* ---- Ayarlar ---- */

  $('#main').innerHTML = '<div class="flex flex-col w-full px-gutter gap-space-lg pb-6">' +

    /* PIN */
    '<section class="card flex flex-col gap-3">' +
      '<h3 class="text-[16px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-secondary-container">shield_lock</span>Veli PIN Kodu</h3>' +
      '<p class="text-[12px] font-semibold text-on-surface-variant">Veli moduna geçişte istenen 4 haneli PIN.</p>' +
      '<div class="grid grid-cols-2 gap-2">' +
        '<div><label class="lbl">Yeni PIN</label><input id="st-pin1" type="password" inputmode="numeric" maxlength="4" class="inp text-center tracking-[0.5em]"></div>' +
        '<div><label class="lbl">PIN Tekrar</label><input id="st-pin2" type="password" inputmode="numeric" maxlength="4" class="inp text-center tracking-[0.5em]"></div>' +
      '</div>' +
      '<button onclick="savePin()" class="btn-ghost"><span class="material-symbols-outlined">lock_reset</span>PIN\'i Güncelle</button>' +
    '</section>' +
    /* Bildirim */
    '<section class="card flex flex-col gap-2">' +
      '<h3 class="text-[16px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-tertiary-fixed-dim">notifications_active</span>Boss Alarmları</h3>' +
      '<p class="text-[12px] font-semibold text-on-surface-variant">Sınavlardan ayarlanan gün önce sesli uyarı + cihaz bildirimi gönderilir.</p>' +
      '<div id="st-notify" class="flex items-center justify-between bg-surface-container-lowest rounded-lg p-3">' +
        '<span class="text-[13px] font-bold text-on-surface">Bildirim izni: ' + (('Notification' in window && Notification.permission === 'granted') ? '<span class="text-primary-container">AÇIK ✓</span>' : '<span class="text-error">KAPALI</span>') + '</span>' +
        '<button onclick="askNotify();setTimeout(renderAyarlar,800)" class="px-3 py-1.5 rounded-full bg-primary-container text-on-primary-container text-[12px] font-extrabold">İzin İste</button>' +
      '</div>' +
    '</section>' +
    /* Firebase */
    '<section class="card flex flex-col gap-3">' +
      '<h3 class="text-[16px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-primary-container">cloud_sync</span>Bulut Senkronu (Firebase)</h3>' +
      '<div class="flex items-center justify-between bg-surface-container-lowest rounded-lg p-3">' +
        '<span class="text-[13px] font-bold text-on-surface">Durum: ' + (FB.connected ? '<span class="text-primary-container">BAĞLI ✓</span>' : '<span class="text-on-surface-variant">Yerel (Lokal)</span>') + '</span>' +
        (FB.connected ? '<button onclick="fbDisconnect()" class="px-3 py-1.5 rounded-full bg-error-container text-on-error-container text-[12px] font-extrabold">Kes</button>' : '') +
      '</div>' +
      '<details class="bg-surface-container-lowest rounded-lg p-3">' +
        '<summary class="text-[13px] font-extrabold text-primary-container cursor-pointer">📡 Firebase kurulum adımları (3 dakika)</summary>' +
        '<ol class="text-[12px] font-semibold text-on-surface-variant list-decimal ml-4 mt-2 space-y-1">' +
          '<li><b>console.firebase.google.com</b> → yeni proje oluştur (Analytics kapatabilirsin).</li>' +
          '<li>Sol menüden <b>Build → Realtime Database</b> seç (<b>Firestore değil!</b>) → "Create Database" → Test mode → Enable.</li>' +
          '<li>Proje ayarlarından (⚙️) bir <b>Web uygulaması</b> ekle (&lt;/&gt; simgesi) → verilen <b>firebaseConfig</b> nesnesini kopyala.</li>' +
          '<li>Aşağıdaki kutuya yapılandırmayı yapıştır → <b>Bağlan</b>.\'da tıkla.</li>' +
          '<li>Bağlanınca uzak veri varsa çekilir; yoksa bu cihazdaki veriler buluta yüklenir. Diğer cihazda aynı config ile bağlan → otomatik senkron! 🔄</li>' +
        '</ol>' +
        '<p class="text-[11px] font-semibold text-secondary mt-2">⚠️ Test modu kuralları herkese açık verir; verilerde yalnızca görev/ödül bilgisi tutulur, yine de Firebase projesini kimseyle paylaşma.</p>' +
      '</details>' +
      '<textarea id="st-fb" class="inp font-mono !text-[11px] min-h-[110px]" placeholder=\'{\n  "apiKey": "AIza...",\n  "authDomain": "proje.firebaseapp.com",\n  "databaseURL": "https://proje-default-rtdb.firebaseio.com",\n  "projectId": "proje",\n  "storageBucket": "proje.appspot.com",\n  "messagingSenderId": "123",\n  "appId": "1:123:web:abc"\n}\'>' + (fb ? esc(JSON.stringify(fb, null, 2)) : '') + '</textarea>' +
      '<button onclick="fbConnectForm()" class="btn-green"><span class="material-symbols-outlined">cloud_upload</span>Bağlan & Senkronize Et</button>' +
    '</section>' +
    /* Yedek */
    '<section class="card flex flex-col gap-3">' +
      '<h3 class="text-[16px] font-extrabold text-primary flex items-center gap-2"><span class="material-symbols-outlined text-tertiary-fixed-dim">save</span>Yedek & Sıfırlama</h3>' +
      '<div class="grid grid-cols-2 gap-2">' +
        '<button onclick="exportData()" class="btn-ghost"><span class="material-symbols-outlined">download</span>Dışa Aktar</button>' +
        '<label class="btn-ghost cursor-pointer"><span class="material-symbols-outlined">upload</span>İçe Aktar<input type="file" id="st-import" accept=".json" class="hidden" onchange="importData(this)"></label>' +
      '</div>' +
      '<button onclick="resetProgress()" class="w-full py-2.5 rounded-full bg-secondary-container/15 text-secondary text-[13px] font-extrabold flex items-center justify-center gap-2"><span class="material-symbols-outlined text-base">restart_alt</span>Ruz İlerlemesini Sıfırla</button>' +
      '<button onclick="resetData()" class="w-full py-2.5 rounded-full bg-error-container/15 text-error text-[13px] font-extrabold flex items-center justify-center gap-2"><span class="material-symbols-outlined text-base">dangerous</span>Tüm Verileri Sıfırla</button>' +
    '</section>' +
    '<p class="text-center text-[11px] font-semibold text-outline-variant">Ödev Avcısı v1.0 • ' + esc(state.student.name) + ' için 💚</p>' +

function savePin(){
  const a = $('#st-pin1').value, b = $('#st-pin2').value;
  if (!/^\d{4}$/.test(a)) { toast('PIN 4 haneli olmalı!'); return; }
  if (a !== b) { toast('PIN\'ler eşleşmiyor!'); return; }
  state.settings.pin = a; save(); toast('🔐 PIN güncellendi');
}
function fbConnectForm(){
  let cfg;
  try { cfg = JSON.parse($('#st-fb').value); } catch(e) { toast('⚠️ JSON formatı hatalı!'); return; }
  if (!cfg.databaseURL || !cfg.projectId) { toast('⚠️ "databaseURL" ve "projectId" zorunlu!'); return; }
  if (fbConnect(cfg)) {
    state.settings.firebase = cfg; save();
    try {
      FB.ref.once('value').then(snap => {
        const remote = snap.val();
        if (remote) {
          toast('☁️ Buluttaki veriler yüklendi (senkron aktif)');
        } else {
          FB.ref.set(state);
          toast('☁️ Bağlandı! Yerel veriler buluta yüklendi.');
        }
        renderAll();
      });
    } catch(e) {}
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'odev-avcisi-yedek-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('💾 Yedek indirildi');
}
function importData(input){
  const f = input.files && input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s.version) throw new Error('Geçersiz dosya');
      askConfirm('Yedeği yükle', 'Mevcut veriler yedekteki verilerle değiştirilecek. Devam?', () => {
        state = migrate(s); save(); renderAll(); toast('✅ Yedek yüklendi');
      }, 'Yükle');
    } catch(e) { toast('⚠️ Dosya okunamadı!'); }
  };
  reader.readAsText(f);
}
function resetData(){
  askConfirm('TÜM VERİLERİ SİL', 'Görevler, XP, sınavlar, ödüller — her şey sıfırlanır ve örnek verilere döner. Bu işlem geri alınamaz!', () => {
    state = seedState(); save(); renderAll(); toast('Uygulama sıfırlandı');
  }, 'Sıfırla');
}
function resetProgress(){
  askConfirm('RUZ İLERLEMESİNİ SIFIRLA', 'XP, seviye, seri, rozetler, tamamlanma durumları ve takas geçmişi sıfırlanacak. Görev listesi, sınavlar, program ve ödüller korunacak. Devam edilsin mi?', () => {
    state.xp = 0;
    state.streak = 0;
    state.lastCompletionDate = null;
    state.history = [];
    state.badges = {};
    state.redemptions = [];
    state.tasks.forEach(t => { t.status = 'active'; t.completedAt = null; });
    state.exams.forEach(e => { delete e.score; delete e.awardedXp; delete e.awardedAt; });
    save(); renderAll(); toast('Ruz ilerlemesi sıfırlandı: LVL 1 • 0 XP');
  }, 'Sıfırla');
}

/* ---------- Onay / Red ---------- */
function approveTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'pending') return;
  t.status = 'completed'; t.completedAt = todayStr();
  state.xp += t.xp;
  addHistory(t.xp); bumpStreak(); checkBadges(); save();
  renderAll();
  toast('✅ Onaylandı! +' + t.xp + ' XP • ' + nf(state.xp) + ' XP toplam');
  beep(false);
}
function rejectTask(id){
  askConfirm('Görevi reddet', 'Görev tekrar "aktif" duruma döner, XP verilmez.', () => {
    const t = state.tasks.find(x => x.id === id); if (t) t.status = 'active';
    save(); renderAll(); toast('Görev reddedildi — tekrar tamamlanabilir');
  }, 'Reddet');
}
function undoCompletedTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'completed') return;
  askConfirm('Tamamlamayı geri al', '"' + t.title + '" yeniden aktif olacak. Verilen ' + nf(t.xp) + ' XP geri alınacak; seri ve rozetler yeniden hesaplanacak.', () => {
    const oldBadgeCount = Object.keys(state.badges).length;
    state.xp = Math.max(0, state.xp - t.xp);
    removeHistory(t.xp, t.completedAt);
    t.status = 'active';
    t.completedAt = null;
    recalcStreak();
    pruneBadges();
    const removedBadges = oldBadgeCount - Object.keys(state.badges).length;
    save(); renderAll();
    toast('↩️ Görev geri alındı • -' + nf(t.xp) + ' XP' + (removedBadges > 0 ? ' • ' + removedBadges + ' rozet kilitlendi' : ''));
  }, 'Geri Al');
}
function approveRedeem(id){
  const r = state.redemptions.find(x => x.id === id); if (!r) return;
  r.status = 'approved'; checkBadges(); save(); renderAll();
  toast('🎁 Ödül onaylandı! İyi eğlenceler!');
  beep(false);
}
function rejectRedeem(id){
  askConfirm('Takası reddet', 'Harcanan ' + nf(state.redemptions.find(x => x.id === id).cost) + ' XP geri iade edilecek.', () => {
    const r = state.redemptions.find(x => x.id === id); if (!r) return;
    r.status = 'rejected'; state.xp += r.cost;
    save(); renderAll(); toast('Takas reddedildi, XP iade edildi');
  }, 'Reddet');
}

/* ---------- Öğrenci görev tamamlama ---------- */
function completeTask(id){
  const t = state.tasks.find(x => x.id === id); if (!t || t.status !== 'active') return;
  askConfirm('Görev bitti mi?', '"' + t.title + '" onaya gönderilecek. Komutanın onaylamasıyla +' + t.xp + ' XP hesabına geçecek!', () => {
    t.status = 'pending'; t.completedAt = null;
    save(); renderAll();
    toast('📨 Görev onaya gönderildi! Onay gelince XP\'n hesabına geçecek ⚡');
    beep(true);
  }, 'Gönder');
}

/* ---------- Görselleştirme ---------- */
/* CSS text-transform Türkçe 'i'yi 'I' yapıyor; yaprak metinleri JS ile TR büyük harfe çevir */
function trUpper(root){
  if (!root) return;
  root.querySelectorAll('*').forEach(el => {
    if (el.children.length === 0 && el.textContent.trim() && getComputedStyle(el).textTransform === 'uppercase') {
      el.textContent = el.textContent.toLocaleUpperCase('tr-TR');
      el.style.textTransform = 'none';
    }
  });
}
function renderAll(){
  renderHeader(); renderNav();
  const v = ui.view;
  if (ui.role === 'parent') {
    if (v === 'panel') renderPanel();
    else if (v === 'gorev') renderGorev();
    else if (v === 'planla') renderPlanla();
    else if (v === 'odulmgr') renderOdulmgr();
    else if (v === 'ayarlar') renderAyarlar();
    else { ui.view = 'panel'; renderPanel(); }
  } else {
    if (v === 'home') renderHome();
    else if (v === 'dersler') renderDersler();
    else if (v === 'program') renderProgram();
    else if (v === 'sinavlar') renderSinavlar();
    else if (v === 'oduller') renderOduller();
    else { ui.view = 'home'; renderHome(); }
  }
  trUpper($('#main'));
  trUpper(document.querySelector('header'));
  trUpper(document.getElementById('bottom-nav'));
}

/* ---------- Timer'lar ---------- */
setInterval(() => {
  const now = new Date();
  // Geri sayımlar
  state.exams.forEach(e => {
    const dt = new Date(e.date + 'T' + (e.time || '09:30'));
    $$('[data-cd="' + e.id + '"]').forEach(el => { el.textContent = cdText(dt - now); });
    const box = $('[data-cd-box="' + e.id + '"]');
    if (box) {
      const ms = Math.max(0, dt - now);
      const set = (u, val) => { const q = box.querySelector('[data-cd-u="' + u + '"]'); if (q) q.textContent = String(val).padStart(2, '0'); };
      set('d', Math.floor(ms/864e5)); set('h', Math.floor(ms%864e5/36e5)); set('m', Math.floor(ms%36e5/6e4)); set('s', Math.floor(ms%6e4/1e3));
    }
  });
  const clock = $('#clock-now'); if (clock) clock.lastElementChild.textContent = now.toTimeString().slice(0, 5);
}, 1000);
setInterval(checkAlarms, 60000);

/* ---------- PWA Manifest ---------- */
try {
  const mf = { name: 'Ödev Avcısı', short_name: 'Ödev Avcısı', display: 'standalone', background_color: '#0f131d', theme_color: '#0f131d', start_url: '.', icons: [{ src: ICON_URI, sizes: '48x48', type: 'image/svg+xml' }] };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
  document.head.appendChild(link);
} catch(e) {}

/* ---------- Başlat ---------- */
checkBadges();
checkAlarms();
renderAll();
</script>
